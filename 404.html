<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Portfolio Moved | K. Meryem Rowe-Ciftci</title>
  <meta
    name="description"
    content="This portfolio has moved to a new location."
  />

  <!-- Prevent the old page from competing with the new portfolio in search results. -->
  <meta name="robots" content="noindex, follow" />

  <!-- Immediate HTML fallback for visitors without JavaScript. -->
  <meta http-equiv="refresh" content="0; url=https://meryemciftcialy.github.io/skills_portfolio/#/" />

  <!-- Identify the new portfolio as the preferred location. -->
  <link rel="canonical" href="https://meryemciftcialy.github.io/skills_portfolio/#/" />

  <script>
    // replace() prevents the browser Back button from returning visitors
    // to this redirect page.
    window.location.replace("https://meryemciftcialy.github.io/skills_portfolio/#/");
  </script>
</head>
<body>
  <main>
    <p>
      My portfolio has moved.
      <a href="https://meryemciftcialy.github.io/skills_portfolio/#/">Open the new portfolio</a>.
    </p>
  </main>
</body>
</html>
